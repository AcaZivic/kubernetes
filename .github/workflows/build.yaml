name: Build Docker Container & Push to DO Registry

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test_django_job:
    uses: AcaZivic/kubernetes/.github/workflows/test-django.yaml@main
  build:
    runs-on: ubuntu-latest
    needs: [test_django_job]
    env:
      CLUSTER_NAME: kubernetes-crm
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Insall doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN_KEY }}
      - name: Login to DO Container Registry with short-lived creds
        run: doctl registry login --expiry-seconds 1200
      - name: Build container image
        working-directory: ./crm
        run: |
          docker build -f Dockerfile \
            -t registry.digitalocean.com/django-crm/crm:latest \
            -t registry.digitalocean.com/django-crm/crm:${GITHUB_SHA::7}-${GITHUB_RUN_ID::5} \
            .
      - name: Push image
        run: |
          docker push registry.digitalocean.com/django-crm/crm --all-tags
      - name: K8s cluster kubeconfig file with/ short-lived creds
        run: |
          doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ env.CLUSTER_NAME }}
      # - name: Update deployment secrets
        # run: |
        #    cat << EOF >> crm/.env.prod
        #    AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
        #    AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #    DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
        #    DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
        #    DJANGO_SUERPUSER_EMAIL=${{ secrets.DJANGO_SUERPUSER_EMAIL }}
        #    DJANGO_SECRET_KEY=${{ secrets.SECRET_KEY }}
        #    ENV_ALLOWED_HOST=${{ secrets.ENV_ALLOWED_HOST }}
        #    POSTGRES_DB=${{ secrets.POSTGRES_DB }}
        #    POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        #    POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        #    POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
        #    POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
        #   EOF
        #    kubectl delete secret django-crm-prod-env
        #    kubectl create secret generic django-crm-prod-env --from-env-file=crm/.env.prod
      - name: Update Deployment image
        run: |
          kubectl set image deployment/crm-deployment crm=registry.digitalocean.com/django-crm/crm:${GITHUB_SHA::7}-${GITHUB_RUN_ID::5}
      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/crm-deployment
      - name: Post-build Django Commands - Migrate / Collectstatic
        run: |
          export SINGLE_POD_NAME=$(kubectl get pod -l app=crm-deployment -o jsonpath="{.items[0].metadata.name}")
          kubectl exec -it $SINGLE_POD_NAME -- bash migrate.sh
          